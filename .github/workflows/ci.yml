name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 前端单元测试
        run: bun test src

      - name: Go 静态检查与测试
        run: |
          go vet ./...
          go test ./...

      - name: 构建应用
        run: bunx mygo build -platform darwin/universal -skip-dmg

  e2e:
    name: e2e
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 安装 PDF 与图片工具
        run: brew install poppler imagemagick

      - name: 端到端测试
        run: bun scripts/e2e.ts

      - name: 上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e-out
          retention-days: 7
