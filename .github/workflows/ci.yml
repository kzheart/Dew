name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 检查与测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bun run typecheck

      - name: 前端单元测试
        run: bun test src

      - name: Go 静态检查与测试
        run: |
          go vet ./...
          go test ./...

      - name: 构建应用
        run: bunx mygo build -platform darwin/universal -skip-dmg

  e2e:
    name: e2e (${{ matrix.sections }} ${{ matrix.attempt }})
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # 分成四组并行，加上检查 job 不超过免费账号同时运行的 5 个 macOS runner。
      matrix:
        sections: [document]
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 安装 poppler
        if: matrix.poppler
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install poppler

      - name: 端到端测试
        run: for i in 1 2 3; do bun scripts/e2e.ts $([ $i -gt 1 ] && echo --no-build) document || true; done

      - name: 上传截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out-${{ strategy.job-index }}
          path: e2e-out
          retention-days: 7
