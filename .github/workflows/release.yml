name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并上传安装包的版本标签，如 v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: 维护发布 PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: 构建并上传安装包
    needs: release-please
    if: >-
      !failure() && !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: macos-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建通用二进制安装包
        run: bunx mygo build -platform darwin/universal -skip-notarize

      - name: 创建 Release（手动推送的标签）
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            version="${TAG#v}"
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "[] ]" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi

      - name: 上传安装包
        run: gh release upload "$TAG" build/darwin-universal/*.dmg --clobber
